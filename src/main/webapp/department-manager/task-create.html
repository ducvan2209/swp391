<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Task</title>
  <link rel="stylesheet" href="../assets/department-manager/css/style.css">
  <link rel="stylesheet" href="../assets/department-manager/css/component.css">
  <link rel="stylesheet" href="../assets/department-manager/css/dashboard.css">
</head>
<body>
  <div class="dm-shell">
    <aside class="dm-sidebar" data-sidebar></aside>
    <div class="dm-main">
      <header class="dm-topbar" data-topbar></header>
      <main class="dm-content section-stack">
        <section class="hero-panel">
          <div>
            <h2>Create focused work with clear ownership.</h2>
            <p>Assign a task, define priority, and set a delivery window so progress stays visible.</p>
          </div>
          <a class="btn btn-secondary" href="task-list.html">Back to Tasks</a>
        </section>

        <section class="card">
          <div class="card-header">
            <div>
              <h3>New Task</h3>
              <p>Prototype form for department assignment</p>
            </div>
          </div>
          <form class="form-grid">
            <div class="field full">
              <label for="taskTitle">Task Title</label>
              <input id="taskTitle" type="text" value="Create employee engagement snapshot">
            </div>
            <div class="field full">
              <label for="description">Description</label>
              <textarea id="description">Prepare a concise engagement summary using attendance signals, request trends, and recent task activity.</textarea>
            </div>
            <div class="field">
              <label for="employee">Employee</label>
              <select id="employee">
                <option>Mai Tran</option>
                <option>Huy Pham</option>
                <option>Lan Nguyen</option>
                <option>Quang Do</option>
              </select>
            </div>
            <div class="field">
              <label for="priority">Priority</label>
              <select id="priority">
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
              </select>
            </div>
            <div class="field">
              <label for="startDate">Start Date</label>
              <input id="startDate" type="date" value="2026-06-04">
            </div>
            <div class="field">
              <label for="dueDate">Due Date</label>
              <input id="dueDate" type="date" value="2026-06-14">
            </div>
            <div class="field full">
              <div class="btn-row">
                <button class="btn btn-primary" type="button" data-toast="Task created successfully">Create</button>
                <a class="btn btn-secondary" href="task-list.html">Cancel</a>
              </div>
            </div>
          </form>
        </section>
      </main>
      <footer class="dm-footer" data-footer></footer>
    </div>
  </div>
  <script src="../assets/department-manager/js/app.js"></script>
</body>
</html>
